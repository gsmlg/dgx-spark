schema-version: 1
id: qwen38-flash-next-fp4-local-b12x
engine: vllm
display-name: Qwen3.8 Flash Next FP4 Local B12X (experimental)
text-only: true
reasoning-default: true
reasoning-toggle: true
reasoning-fields: [reasoning, reasoning_content]
tool-support: true
# Configured limits, not target-host qualification or simultaneous full windows.
context-tokens: 262144
max-running-requests: 8
runtime-environment:
  VLLM_PLE_TABLE_MEMORY: disk
  B12X_DISK_BACKEND: io_uring
  CUTE_DSL_ARCH: sm_121a
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: auto
  VLLM_MXFP8_LM_HEAD: "1"
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"
required-runtime-features: [b12x, modelopt_mixed, qwen3, qwen3_xml]
# B12X reads PLE rows directly from read-only safetensors shard offsets.
derived-cache: null
# Model/storage allowance; lifecycle adds image/cache headroom and free reserve.
prepare-storage-gib: 160
